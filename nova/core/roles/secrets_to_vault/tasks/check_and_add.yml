---
- name: Including secrets save tasks...
  delegate_to: localhost
  become: false
  block:
    - name: Listing all secrets in {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        # KVv2 REQUIREMENT: We must swap /data/ to /metadata/ to perform a directory LIST
        url: "{{ (secrets_by_group | map(attribute='vault_path') | first) | regex_replace('/data/', '/metadata/') }}"
        method: LIST
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
        status_code:
          - 200
          - 404
      register: existing_secrets

    # NOTE: The old "Creating path..." task has been removed. 
    # In KVv2, folders are virtual; you cannot POST an empty object to create a folder path.

    - name: Updating following secrets in {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        # KVv2 REQUIREMENT: We append the unique secret key name to the URL path
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ account_key_name if sct.username is defined else sct.key }}"
        method: POST  # Swapped to POST to cleanly create/overwrite individual key endpoints
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body:
          # KVv2 REQUIREMENT: Payloads must be nested under a top-level "data" object
          data:
            value: "{{ sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret) }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ account_key_name if sct.username is defined else sct.key }}"
      when: autogenerated_secret or sct.autogenerated_secret | default(false)

    - name: Saving following secrets to {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        # KVv2 REQUIREMENT: We append the unique secret key name to the URL path
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ account_key_name if sct.username is defined else sct.key }}"
        method: POST
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body:
          data:
            value: "{{ sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret) }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ account_key_name if sct.username is defined else sct.key }}"
      when:
        # Checks if directory is entirely missing (404) OR if this specific key is missing from the listed metadata array
        - existing_secrets.status == 404 or (account_key_name if sct.username is defined else sct.key) not in existing_secrets.json.data.keys | default([])
        - not autogenerated_secret or not sct.autogenerated_secret | default(false)

