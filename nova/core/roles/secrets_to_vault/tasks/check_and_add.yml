---
- name: Including secrets save tasks...
  delegate_to: localhost
  become: false
  block:
    - name: Listing all secrets in {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        # KVv2 REQUIREMENT: We must swap /data/ to /metadata/ to perform a directory LIST
        url: "{{ (secrets_by_group | map(attribute='vault_path') | first) | regex_replace('/data/', '/metadata/') }}"
        method: LIST
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
        status_code:
          - 200
          - 404
      register: existing_secrets

    - name: Updating following secrets in {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        # KVv2 REQUIREMENT + Path Normalization: Trims tailing team extensions to hit the core secret path
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ (account_key_name if sct.username is defined else sct.key) | regex_replace('_t[0-9]{2}_' ~ (sct.username | default('')), '') }}"
        method: PATCH
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
          Content-Type: application/merge-patch+json
        body:
          # KVv2 REQUIREMENT: Nested under "data" object mapping custom user keys directly
          data: "{{ {sct.username | default(sct.key): (sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret))} }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ account_key_name if sct.username is defined else sct.key }}"
      when: autogenerated_secret or sct.autogenerated_secret | default(false)

    - name: Creating fresh secrets path in {{ secrets_by_group | map(attribute='vault_path') | first }} (PUT)...
      ansible.builtin.uri:
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ (account_key_name if sct.username is defined else sct.key) | regex_replace('_t[0-9]{2}_' ~ (sct.username | default('')), '') }}"
        method: PUT  # Use PUT when path doesn't exist yet to initialize it
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body:
          data: "{{ {sct.username | default(sct.key): (sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret))} }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
        status_code: [200, 204]
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ account_key_name if sct.username is defined else sct.key }}"
      when:
        - existing_secrets.status == 404
        - not autogenerated_secret or not sct.autogenerated_secret | default(false)

    - name: Appending secrets to existing path in {{ secrets_by_group | map(attribute='vault_path') | first }} (PATCH)...
      ansible.builtin.uri:
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ (account_key_name if sct.username is defined else sct.key) | regex_replace('_t[0-9]{2}_' ~ (sct.username | default('')), '') }}"
        method: PATCH
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
          Content-Type: application/merge-patch+json
        body:
          data: "{{ {sct.username | default(sct.key): (sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret))} }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
        status_code: [200, 204]
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ account_key_name if sct.username is defined else sct.key }}"
      when:
        - existing_secrets.status != 404
        # FIX: Swapped .keys to ['keys'] so Jinja treats it as the array item from Vault, not a Python method
        - (account_key_name if sct.username is defined else sct.key) | regex_replace('_t[0-9]{2}_' ~ (sct.username | default('')), '') not in existing_secrets.json.data['keys'] | default([])
        - not autogenerated_secret or not sct.autogenerated_secret | default(false)

