---
- name: Reset Vault payload
  ansible.builtin.set_fact:
    vault_secret_data: {}

- name: Including secrets save tasks...
  delegate_to: localhost
  become: false
  block:
    - name: Building Vault secret data...
      ansible.builtin.set_fact:
        vault_secret_data: >-
          {{
            vault_secret_data | default({})
            | combine({
                (sct.username | default(sct.key) | regex_replace('_t[0-9]{2}_' ~ (sct.username | default('')), '')):
                  (sct.value | default(sct.password) | default(secrets_to_vault_autogenerated_key_secret))
              })
          }}
      loop: "{{ secrets_by_group }}"
      loop_control:
        loop_var: sct
        label: "{{ sct.username | default(sct.key) }}"

    - name: Saving or overwriting secrets in {{ secrets_by_group | map(attribute='vault_path') | first }}...
      ansible.builtin.uri:
        url: "{{ secrets_by_group | map(attribute='vault_path') | first }}/{{ account_key_name }}"
        method: POST
        headers:
          X-Vault-Request: true
          X-Vault-Token: "{{ vault_access_token | default(auth.json.auth.client_token) }}"
        body:
          data: "{{ vault_secret_data }}"
        body_format: json
        validate_certs: "{{ validate_vault_certs }}"
        status_code: [200, 204]

